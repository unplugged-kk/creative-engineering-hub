# CEH taxonomy. Data, not code: add a capability, type or category here and every command picks it up.
# Matching is keyword-based over a resource's name, description, topics and README head.
# A keyword is a lowercase phrase; it matches on word boundaries.

resource_types:
  repository: {}
  agent-skill: {keywords: [skill.md, agent skill, claude skill, claude code skill, skills]}
  npm-package: {}
  python-package: {}
  mcp-server: {keywords: [mcp server, model context protocol, mcp]}
  agent-extension: {keywords: [plugin, extension, marketplace]}
  tutorial: {keywords: [tutorial, how to, guide, course]}
  website: {}
  template: {keywords: [template, starter, boilerplate, starter kit]}
  model: {keywords: [model weights, huggingface, checkpoint]}
  technique: {}
  workflow: {keywords: [pipeline, workflow, automation]}
  asset-library: {keywords: [stock footage, stock video, free stock, sound effects library, cc0]}
  renderer: {keywords: [renderer, render engine, rendering engine, video rendering framework, programmatic video, videos programmatically, render video, html to video, video framework]}


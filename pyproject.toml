[project]
name = "creative-engineering-hub"
version = "0.1.0"
description = "CEH: registry, R&D lab, skills library and upstream intelligence for creative engineering."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
ceh = "ceh.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ceh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# adds live GitHub metadata, and writes reports/historical-migration/REPORT.md.
# Fields: url (canonical), group, previous (decision recorded in earlier research), pinned (commit recorded
# by earlier research or lockfile), local (existing copies on this machine), forks (user forks), status
# (CEH lifecycle to start in), strategy (upstream strategy), evidence (where the facts came from), note.

